services:
  9router:
    image: ghcr.io/newnol/9router-wolfi:latest
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:20128:20128"
    environment:
      INITIAL_PASSWORD: "${INITIAL_PASSWORD:?Set INITIAL_PASSWORD before starting}"
    volumes:
      - data:/app/data
      - home:/app/data-home
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  data:
  home:
